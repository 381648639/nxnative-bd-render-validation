name: Build the validated legacy compiler freeze candidate

on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: Private new-save gameplay run with an inspected freeze-validation verdict
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  GH_TOKEN: ${{ secrets.BD_PRIVATE_REPO_TOKEN }}
  BD_ASSET_REPOSITORY: wanghao940607-oss/nxnative-pokemon-bd-ios-build

concurrency:
  group: bd-ios-freeze-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: 1942eaa5e2a767809868994c27dfc5d692439fdc
          path: nxnative
          persist-credentials: false
      - name: Restore private host inputs and inspected new-save evidence
        env:
          VALIDATION_RUN: ${{ inputs.validation_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$BD_ASSET_REPOSITORY" --jq .private)" = true
          mkdir -p private-inputs
          gh release download bd-resolution-build-inputs-v1 --repo "$BD_ASSET_REPOSITORY" --pattern 'verified-r5-host-inputs.*' --dir private-inputs
          gh release download "bd-visual-$VALIDATION_RUN" --repo "$BD_ASSET_REPOSITORY" --pattern freeze-validation.json --dir private-inputs
      - name: Apply the same bounded compiler and legacy archive policy
        shell: bash
        run: |
          set -euo pipefail
          for patch in legacy-renderer legacy-diagnostics legacy-prediction nonfinite-varyings frame-target frame-target-default unity-resolution graphics-controls stability-cache stability-hud compiler-queue; do
            git -C nxnative apply --check "../build-config/patches/$patch.patch"
            git -C nxnative apply "../build-config/patches/$patch.patch"
          done
          make -C nxnative/dm/host GAME=0100000011D90000 game_profile
          for name in unity_screen unity_quality; do
            clang -O1 -g -I nxnative/dm/host/gen/0100000011D90000 "nxnative/dm/host/tests/t_$name.c" -o "/tmp/t_$name"
            "/tmp/t_$name"
          done
          cd nxnative
          python3 -m unittest dm.tools.tests.test_launcher_settings
          cd ..
          command -v xcodegen || brew install xcodegen
      - name: Build and inspect the unsigned iOS 16.1 host
        run: python3 build-config/tools/build_freeze_host_delta.py nxnative build-config private-inputs private-inputs/freeze-validation.json private-output
      - name: Preserve the host delta only in private storage
        shell: bash
        run: |
          set -euo pipefail
          tag="bd-ios-r9-host-$GITHUB_RUN_ID"
          gh release create "$tag" --repo "$BD_ASSET_REPOSITORY" --title 'Private r9 legacy compiler candidate' --notes 'Unsigned iOS 16.1 host delta; game resources and shader chain unchanged. New-save Mac evidence is included. Device recovery remains unverified.' --prerelease
          gh release upload "$tag" --repo "$BD_ASSET_REPOSITORY" private-output/r9-host-delta.zip private-output/r9-host-delta.json
