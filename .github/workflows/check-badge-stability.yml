name: Reproduce the November 7 gameplay freeze

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Existing r8 or bounded compiler candidate
        type: choice
        options: [baseline, candidate]
        default: baseline

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  GH_TOKEN: ${{ secrets.BD_PRIVATE_REPO_TOKEN }}
  BD_ASSET_REPOSITORY: wanghao940607-oss/nxnative-pokemon-bd-ios-build

concurrency:
  group: bd-freeze-repro-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  gameplay:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: 1942eaa5e2a767809868994c27dfc5d692439fdc
          path: nxnative
          persist-credentials: false
      - name: Restore the hash-verified real game runtime privately
        id: runtime
        run: python3 build-config/tools/private_runtime_cache.py restore
      - name: Build the selected production code with operation tracing
        env:
          VALIDATION_VARIANT: ${{ inputs.variant }}
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.runtime.outputs.found }}' = true
          for patch in legacy-renderer legacy-diagnostics legacy-prediction frame-target frame-target-default unity-resolution graphics-controls stability-cache stability-hud; do
            git -C nxnative apply --check "../build-config/patches/$patch.patch"
            git -C nxnative apply "../build-config/patches/$patch.patch"
          done
          if test "$VALIDATION_VARIANT" = candidate; then
            git -C nxnative apply --check ../build-config/patches/compiler-queue.patch
            git -C nxnative apply ../build-config/patches/compiler-queue.patch
          fi
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files = ['dm/gfx/nvn/nvn_pipeline_cache.m', 'dm/gfx/nvn/nvn_mtl_legacy.inc', 'dm/host/hle_unity_screen.c', 'dm/host/hle_unity_quality.c', 'dm/ios/Sources/front_ios.m']
          files += [p.as_posix() for p in Path('nxnative/dm/gfx/nvn').glob('nvn_compile_queue.*')]
          files = [p.removeprefix('nxnative/') for p in files]
          record = {'variant': os.environ['VALIDATION_VARIANT'], 'production_sha256': {p: hashlib.sha256((Path('nxnative') / p).read_bytes()).hexdigest() for p in files}}
          Path('game-runtime/freeze-sources.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          python3 build-config/tools/prepare_visual_host.py nxnative
          python3 build-config/tools/prepare_badge_probe.py nxnative
          python3 build-config/tools/rebuild_visual_host.py nxnative build-config game-runtime nonfinite-probe
          python3 build-config/tools/probe_nonfinite_varyings.py game-runtime
          python3 build-config/tools/prepare_visual_resources.py nxnative game-runtime
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('game-runtime/runtime.json')
          data = json.loads(p.read_text())
          data['env'].update(DM_FPS_TARGET='30', DM_OPMODE='0', DM_SCREEN_RESOLUTION='960x540', DM_SHADOW_QUALITY='native', DM_NVN_SHOT_OUT='1920x1080', DM_PRESENT_HZ='60', DM_PRESENT_LINK='0', DM_PIPELINE_TRACE='1', DM_PIPELINE_CACHE_DIR=str(Path('game-runtime/run/pipeline-cache').resolve()), DM_WATCH_STALL='60', DM_WATCH_SAMPLE=str(Path('visual-evidence/stall-sample.txt').resolve()))
          if os.environ['VALIDATION_VARIANT'] == 'candidate':
              data['env']['DM_PIPELINE_CACHE'] = 'off'
          data['freeze_sources'] = json.loads(Path('game-runtime/freeze-sources.json').read_text())
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Restore the new unmodified user save
        shell: bash
        run: |
          set -euo pipefail
          gh release download bd-freeze-inputs-20261107 --repo "$BD_ASSET_REPOSITORY" --pattern freeze-inputs.zip --output freeze-inputs.zip
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import zipfile
          p = Path('freeze-inputs.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'c37f294395d9b31e48b72572f6241f836c63161439364b15416b757298769e49'
          Path('game-runtime/run/save').mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(p) as z:
              for name in ('SaveData.bin', 'Backup.bin'):
                  (Path('game-runtime/run/save') / name).write_bytes(z.read(name))
          PY
      - name: Observe actual gameplay and accept private input batches
        run: python3 build-config/tools/visual_session.py game-runtime visual-evidence --minutes 35
      - name: Preserve evidence only in private storage
        if: always()
        run: python3 build-config/tools/preserve_private_evidence.py
