name: Reproduce the first gym badge with traditional Metal persistence

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Reproduce the existing host or validate the candidate cache isolation
        type: choice
        options: [baseline, candidate]
        default: baseline

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  GH_TOKEN: ${{ secrets.BD_PRIVATE_REPO_TOKEN }}
  BD_ASSET_REPOSITORY: wanghao940607-oss/nxnative-pokemon-bd-ios-build

concurrency:
  group: bd-badge-stability-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  gameplay:
    runs-on: xcode-27
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: 1942eaa5e2a767809868994c27dfc5d692439fdc
          path: nxnative
          persist-credentials: false
      - name: Verify final-frame menu observation against private inspected captures
        shell: bash
        run: |
          set -euo pipefail
          command -v tesseract || brew install tesseract
          mkdir -p frame-reader-models visual-evidence/reader-fixtures
          for language in chi_sim eng; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$language.traineddata" --output "frame-reader-models/$language.traineddata"
          done
          echo "BD_OCR_DATA=$PWD/frame-reader-models" >> "$GITHUB_ENV"
          for name in power-up-punch-selected.png power-up-punch-selected-02.png chimchar-select.png chimchar-field.png; do
            gh release download bd-visual-41447785856 --repo "$BD_ASSET_REPOSITORY" --pattern "$name" --dir visual-evidence/reader-fixtures
          done
          BD_OCR_DATA="$PWD/frame-reader-models" python3 build-config/tools/check_frame_reader.py visual-evidence/reader-fixtures
          cp visual-evidence/reader-fixtures/reader-check.json visual-evidence/frame-reader-check.json
      - name: Restore the verified runtime privately
        id: runtime
        run: python3 build-config/tools/private_runtime_cache.py restore
      - name: Build the existing host with development operation traces
        env:
          VALIDATION_VARIANT: ${{ inputs.variant }}
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.runtime.outputs.found }}' = true
          for patch in legacy-renderer legacy-diagnostics legacy-prediction frame-target frame-target-default unity-resolution graphics-controls; do
            git -C nxnative apply --check "../build-config/patches/$patch.patch"
            git -C nxnative apply "../build-config/patches/$patch.patch"
          done
          if test "$VALIDATION_VARIANT" = candidate; then
            for patch in stability-cache stability-hud; do
              git -C nxnative apply --check "../build-config/patches/$patch.patch"
              git -C nxnative apply "../build-config/patches/$patch.patch"
            done
          fi
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files = ['dm/gfx/nvn/nvn_pipeline_cache.m', 'dm/host/hle_unity_screen.c', 'dm/host/hle_unity_quality.c', 'dm/ios/Sources/front_ios.m']
          record = {'variant': os.environ['VALIDATION_VARIANT'], 'production_sha256': {p: hashlib.sha256((Path('nxnative') / p).read_bytes()).hexdigest() for p in files}}
          Path('game-runtime/stability-sources.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          python3 build-config/tools/prepare_visual_host.py nxnative
          python3 build-config/tools/prepare_badge_probe.py nxnative
          python3 build-config/tools/rebuild_visual_host.py nxnative build-config game-runtime nonfinite-probe
          python3 build-config/tools/probe_nonfinite_varyings.py game-runtime
          python3 build-config/tools/prepare_visual_resources.py nxnative game-runtime
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('game-runtime/runtime.json')
          data = json.loads(p.read_text())
          data['env'].update(DM_FPS_TARGET='30', DM_OPMODE='0', DM_SCREEN_RESOLUTION='960x540', DM_SHADOW_QUALITY='native', DM_NVN_SHOT_OUT='1920x1080', DM_PRESENT_HZ='60', DM_PRESENT_LINK='0', DM_PIPELINE_TRACE='1', DM_PIPELINE_CACHE_DIR=str(Path('game-runtime/run/pipeline-cache').resolve()))
          data['stability_sources'] = json.loads(Path('game-runtime/stability-sources.json').read_text())
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Restore the first gym leader save unchanged
        shell: bash
        run: |
          set -euo pipefail
          gh release download bd-badge-repro-inputs-20261102 --repo "$BD_ASSET_REPOSITORY" --pattern gym-save.zip --output gym-save.zip
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import zipfile
          p = Path('gym-save.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '2c43aa2342bec215e938a1d8db204d075612ac97ec5bcbbeba4c2ba9eac4539a'
          with zipfile.ZipFile(p) as z:
              assert set(z.namelist()) == {'SaveData.bin', 'Backup.bin'}
              z.extractall('game-runtime/run/save')
          PY
      - name: Inspect the leader fight and badge presentation
        run: python3 build-config/tools/visual_session.py game-runtime visual-evidence --minutes 300 --autoplay-roark
      - name: Preserve evidence only in private storage
        if: always()
        run: python3 build-config/tools/preserve_private_evidence.py
