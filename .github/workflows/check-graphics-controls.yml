name: Verify shadow controls and active render size in real gameplay

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  GH_TOKEN: ${{ secrets.BD_PRIVATE_REPO_TOKEN }}
  BD_ASSET_REPOSITORY: wanghao940607-oss/nxnative-pokemon-bd-ios-build

concurrency:
  group: bd-graphics-controls
  cancel-in-progress: false

jobs:
  gameplay:
    runs-on: xcode-27
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: 1942eaa5e2a767809868994c27dfc5d692439fdc
          path: nxnative
          persist-credentials: false
      - name: Restore verified game assets from private storage
        id: runtime
        run: python3 build-config/tools/private_runtime_cache.py restore
      - name: Compile the real controls and guarded native-field tests
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.runtime.outputs.found }}' = true
          for patch in legacy-renderer legacy-diagnostics legacy-prediction frame-target frame-target-default unity-resolution graphics-controls; do
            git -C nxnative apply --check "../build-config/patches/$patch.patch"
            git -C nxnative apply "../build-config/patches/$patch.patch"
          done
          make -C nxnative/dm/host GAME=0100000011D90000 game_profile
          for name in unity_screen unity_quality; do
            clang -O1 -g -I nxnative/dm/host/gen/0100000011D90000 "nxnative/dm/host/tests/t_$name.c" -o "/tmp/t_$name"
            "/tmp/t_$name"
          done
          python3 build-config/tools/prepare_visual_host.py nxnative
          python3 build-config/tools/prepare_graphics_controls_probe.py nxnative build-config game-runtime
          python3 build-config/tools/prepare_resolution_probe.py nxnative build-config game-runtime
          python3 build-config/tools/rebuild_visual_host.py nxnative build-config game-runtime nonfinite-probe
          python3 build-config/tools/probe_nonfinite_varyings.py game-runtime
          python3 build-config/tools/prepare_visual_resources.py nxnative game-runtime
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('game-runtime/runtime.json')
          data = json.loads(p.read_text())
          data['env'].update(DM_FPS_TARGET='30', DM_OPMODE='0', DM_SCREEN_RESOLUTION='960x540', DM_SHADOW_QUALITY='native', DM_NVN_SHOT_OUT='1920x1080', DM_PRESENT_HZ='60', DM_PRESENT_LINK='0')
          data['graphics_controls_probe'] = json.loads(Path('game-runtime/graphics-controls-probe.json').read_text())
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Restore the inspected outdoor and bedroom saves
        shell: bash
        run: |
          set -euo pipefail
          gh release download bd-visual-41269402051 --repo "$BD_ASSET_REPOSITORY" --pattern game-save.zip --output outdoor-save.zip
          gh release download bd-visual-41199450210 --repo "$BD_ASSET_REPOSITORY" --pattern game-save.zip --output bedroom-save.zip
          mkdir -p game-runtime/run/save game-runtime/run/save-bedroom
          unzip -q outdoor-save.zip -d game-runtime/run/save
          unzip -q bedroom-save.zip -d game-runtime/run/save-bedroom
      - name: Inspect real native shadow targets and pictures
        run: python3 build-config/tools/visual_session.py game-runtime visual-evidence --minutes 30
      - name: Preserve evidence only in private storage
        if: always()
        run: python3 build-config/tools/preserve_private_evidence.py
