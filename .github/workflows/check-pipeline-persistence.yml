name: Check traditional pipeline cache isolation and restart reuse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: 1942eaa5e2a767809868994c27dfc5d692439fdc
          path: nxnative
          persist-credentials: false
      - name: Compile the actual traditional cache and controlled archive fixture
        shell: bash
        run: |
          set -euo pipefail
          git -C nxnative apply --check ../build-config/patches/stability-cache.patch
          git -C nxnative apply ../build-config/patches/stability-cache.patch
          make -C nxnative/dm/host GAME=0100000011D90000 game_profile
          clang -O1 -g -Wall -Wno-incompatible-pointer-types -fobjc-arc -I nxnative/dm/host/gen/0100000011D90000 nxnative/dm/gfx/tests/t_pipeline_cache.m -framework Metal -framework Foundation -o /tmp/t_pipeline_cache
      - name: Hold archive recording and serialization while demanding real pipeline results
        shell: bash
        run: |
          set -euo pipefail
          for mode in add write failure lookup bound; do
            /tmp/t_pipeline_cache "$mode" "$RUNNER_TEMP/cache-$mode"
          done
      - name: Verify real Metal archives survive a fresh process
        shell: bash
        run: |
          set -euo pipefail
          /tmp/t_pipeline_cache seed "$RUNNER_TEMP/cache-restart"
          /tmp/t_pipeline_cache replay "$RUNNER_TEMP/cache-restart"
      - name: Prove the same controlled stalls block the original cache
        shell: bash
        run: |
          set -euo pipefail
          git -C nxnative show HEAD:dm/gfx/nvn/nvn_pipeline_cache.m > nxnative/dm/gfx/nvn/nvn_pipeline_cache.m
          clang -O1 -g -Wall -Wno-incompatible-pointer-types -fobjc-arc -I nxnative/dm/host/gen/0100000011D90000 nxnative/dm/gfx/tests/t_pipeline_cache.m -framework Metal -framework Foundation -o /tmp/t_pipeline_cache_old
          for mode in add write; do
            if /tmp/t_pipeline_cache_old "$mode" "$RUNNER_TEMP/cache-old-$mode"; then
              echo "Original cache unexpectedly passed $mode isolation"
              exit 1
            fi
          done
