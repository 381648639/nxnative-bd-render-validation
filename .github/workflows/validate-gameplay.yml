name: Verify Brilliant Diamond legacy renderer with private inputs

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Maximum duration of the interactive real game session
        default: '75'
        required: true
        type: string
      variant:
        description: Production renderer revision to inspect
        default: r3
        type: choice
        options:
          - r3
          - r2
      save_run:
        description: Optional earlier visual run whose game-save.zip should be restored
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bd-real-game-visual-validation
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  GH_TOKEN: ${{ secrets.BD_PRIVATE_REPO_TOKEN }}
  BD_ASSET_REPOSITORY: wanghao940607-oss/nxnative-pokemon-bd-ios-build

jobs:
  gameplay:
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: 1942eaa5e2a767809868994c27dfc5d692439fdc
          path: nxnative
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore reusable game assets from private release storage
        id: runtime
        run: python3 build-config/tools/private_runtime_cache.py restore
      - name: Check exact source and prepare legacy development host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C nxnative rev-parse HEAD)" = 1942eaa5e2a767809868994c27dfc5d692439fdc
          xcodebuild -version
          xcrun --sdk macosx metal --version
          for patch in legacy-renderer legacy-diagnostics legacy-prediction; do
            git -C nxnative apply --check "../build-config/patches/$patch.patch"
            git -C nxnative apply "../build-config/patches/$patch.patch"
          done
          python3 build-config/tools/prepare_visual_host.py nxnative
      - name: Download private base game and update
        if: steps.runtime.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs game-input
          gh release download bd-inputs-v1 --repo "$BD_ASSET_REPOSITORY" --pattern 'bd-base-xci.part-*' --dir inputs
          gh release download bd-inputs-v1 --repo "$BD_ASSET_REPOSITORY" --pattern 'bd-update-v393216.part-*' --dir inputs
          gh release download bd-inputs-v1 --repo "$BD_ASSET_REPOSITORY" --pattern input-manifest.json --dir inputs
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          m = json.loads(Path('inputs/input-manifest.json').read_text())
          assert m['title_id'] == '0100000011D90000'
          assert m['update_version'] == 'v393216'
          for key, pattern, name in [
              ('base_xci', 'inputs/bd-base-xci.part-*', 'Pokemon Brilliant Diamond [0100000011D90000][US][v0].xci'),
              ('update_nsp', 'inputs/bd-update-v393216.part-*', 'Pokemon Brilliant Diamond [0100000011D90000][US][v393216].nsp')
          ]:
              subprocess.run(['python3', 'build-config/tools/join_parts.py', 'game-input/' + name,
                              pattern, str(m[key]['size']), m[key]['sha256']], check=True)
          PY
      - name: Install locked build dependencies
        if: steps.runtime.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'nsz==5.0.0' 'lz4==4.4.5' 'capstone==5.0.9' 'fonttools==4.68.0' 'backports.zstd==1.8.0'
          dotnet --version
          zstd --version
      - name: Write private keys without logging them
        if: steps.runtime.outputs.found != 'true'
        env:
          BD_PROD_KEYS: ${{ secrets.BD_PROD_KEYS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BD_PROD_KEYS"
          umask 077
          printf '%s' "$BD_PROD_KEYS" > game-input/prod.keys
      - name: Build real 1.3.0 guest game for the legacy Mac host
        if: steps.runtime.outputs.found != 'true'
        working-directory: nxnative
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_ipa_from_nsp.py ../game-input \
            --keys ../game-input/prod.keys --package v393216 \
            --platform mac --gpu none --motion --progress lines
          grep -F -- '-DDM_NVN_LEGACY_RENDERER_TEST=1' ../game-input/*_build/logs/mac_host_command.json
      - name: Stage only runtime assets
        if: steps.runtime.outputs.found != 'true'
        run: python3 build-config/tools/stage_visual_runtime.py game-input/0100000011D90000_build/visual-runtime.json game-runtime
      - name: Rebuild only the host when reusing assets or comparing r2
        if: steps.runtime.outputs.found == 'true' || inputs.variant == 'r2'
        env:
          VARIANT: ${{ inputs.variant }}
        run: python3 build-config/tools/rebuild_visual_host.py nxnative build-config game-runtime "$VARIANT"
      - name: Prepare all legacy companions also required by the iOS package
        run: python3 build-config/tools/prepare_visual_resources.py nxnative game-runtime
      - name: Keep reusable runtime assets in private storage only
        if: steps.runtime.outputs.found != 'true' && inputs.variant == 'r3'
        run: python3 build-config/tools/private_runtime_cache.py save
      - name: Restore a prior cloud gameplay save for the same scene
        if: inputs.save_run != ''
        env:
          SAVE_RUN: ${{ inputs.save_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SAVE_RUN" =~ ^[0-9]+$ ]]
          gh release download "bd-visual-$SAVE_RUN" --repo "$BD_ASSET_REPOSITORY" --pattern game-save.zip --output cloud-save.zip
          mkdir -p game-runtime/run/save
          unzip -q cloud-save.zip -d game-runtime/run/save
      - name: Run real guest game with interactive input and screenshots
        env:
          SESSION_MINUTES: ${{ inputs.minutes }}
        shell: bash
        run: |
          set -euo pipefail
          python3 build-config/tools/visual_session.py game-runtime visual-evidence --minutes "$SESSION_MINUTES"
      - name: Preserve diagnostics privately
        if: always()
        shell: bash
        run: |
          python3 build-config/tools/preserve_private_evidence.py
